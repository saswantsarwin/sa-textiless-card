<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Balaji Appuswamy — SA Textiless Private Limited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fanwood+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E2E4A;
    --navy-deep:#132038;
    --brass:#AD8A4E;
    --brass-soft:#D8C39F;
    --ivory:#FAF6EF;
    --ink:#22201D;
    --muted:#69625A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    background:#E7E1D6;
    font-family:'Fanwood Text', serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  .card{
    width:100%;
    max-width:420px;
    background:var(--ivory);
    border-radius:3px;
    overflow:hidden;
    box-shadow:0 24px 50px -18px rgba(20,25,35,0.45);
    animation:rise .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .header{
    background:var(--navy);
    padding:36px 28px 28px;
    text-align:center;
    position:relative;
  }
  .header::after{
    content:"";
    position:absolute;
    left:28px; right:28px; bottom:0;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--brass-soft), transparent);
  }
  .mark{ width:64px; height:76px; margin:0 auto 14px; display:block; }
  .company{
    font-size:22px;
    letter-spacing:.02em;
    color:var(--ivory);
    line-height:1.3;
  }
  .company .sub{
    display:block;
    font-style:italic;
    font-size:13px;
    letter-spacing:.1em;
    color:var(--brass-soft);
    margin-top:2px;
  }

  .person{ padding:28px 28px 6px; text-align:center; }
  .person h1{ font-size:27px; font-weight:400; color:var(--navy); line-height:1.2; }
  .person .role{ font-style:italic; font-size:14px; color:var(--muted); margin-top:4px; }

  .stitch{
    margin:20px 28px 4px;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--brass) 0 5px, transparent 5px 10px);
  }

  .contacts{ padding:16px 28px 4px; display:flex; flex-direction:column; gap:2px; }
  .row{
    display:flex; align-items:center; gap:14px;
    padding:12px 4px;
    text-decoration:none; color:var(--ink);
    border-bottom:1px solid rgba(30,46,74,0.09);
  }
  .row:last-child{ border-bottom:none; }
  .row:active{ background:rgba(30,46,74,0.05); }
  .icon{
    flex:0 0 auto; width:36px; height:36px; border-radius:50%;
    background:var(--navy);
    display:flex; align-items:center; justify-content:center;
  }
  .icon svg{ width:16px; height:16px; stroke:var(--brass-soft); }
  .row .text{ display:flex; flex-direction:column; min-width:0; }
  .row .label{ font-style:italic; font-size:11px; letter-spacing:.08em; color:var(--muted); }
  .row .value{ font-size:15px; color:var(--ink); word-break:break-word; }

  .address{ padding:16px 28px 4px; font-size:13px; line-height:1.6; color:var(--muted); }
  .address .heading{ font-style:italic; font-size:12px; color:var(--brass); margin-bottom:5px; }
  .address + .address{ margin-top:8px; }

  .cta-wrap{ padding:26px 28px 30px; }
  .save-btn{
    width:100%; padding:15px 18px;
    background:var(--navy); color:var(--ivory); border:none; border-radius:2px;
    font-family:'Fanwood Text', serif; font-size:14.5px; letter-spacing:.06em;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .15s ease, background .2s ease;
  }
  .save-btn svg{ width:16px; height:16px; stroke:var(--brass-soft); }
  .save-btn:active{ transform:scale(.98); background:var(--navy-deep); }
  .save-btn.saved{ background:#3d6b4a; }
  .save-btn.saved svg{ stroke:#fff; }
</style>
</head>
<body>

<div class="card">

  <div class="header">
    <svg class="mark" viewBox="0 0 100 118" fill="none">
      <path d="M40,24 L40,10 Q40,4 46,4 L54,4 Q60,4 60,10 L60,24" stroke="#D8C39F" stroke-width="3.2" fill="none"/>
      <path d="M31,24 L69,24 L82,100 L18,100 Z" fill="none" stroke="#D8C39F" stroke-width="2.4"/>
      <text x="50" y="42" text-anchor="middle" font-family="'Fanwood Text', serif" font-size="18" fill="#D8C39F" letter-spacing="2">SAT</text>
      <!-- cotton husk, splayed open like petals -->
      <path d="M49.5,72.0 Q58.3,72.2 65.9,76.6 Q59.2,82.3 50.5,84.0 Q50.0,78.0 49.5,72.0 Z" fill="#D8C39F"/>
      <path d="M54.0,73.5 Q60.0,80.1 61.9,88.7 Q53.1,87.7 46.0,82.5 Q50.0,78.0 54.0,73.5 Z" fill="#D8C39F"/>
      <path d="M56.0,78.0 Q55.1,86.8 50.0,94.0 Q44.9,86.8 44.0,78.0 Q50.0,78.0 56.0,78.0 Z" fill="#D8C39F"/>
      <path d="M54.0,82.5 Q46.9,87.7 38.1,88.7 Q40.0,80.1 46.0,73.5 Q50.0,78.0 54.0,82.5 Z" fill="#D8C39F"/>
      <path d="M49.5,84.0 Q40.8,82.3 34.1,76.6 Q41.7,72.2 50.5,72.0 Q50.0,78.0 49.5,84.0 Z" fill="#D8C39F"/>
      <!-- blooming cotton lint -->
      <circle cx="50" cy="70" r="12" fill="#F5EFE2"/>
      <circle cx="38" cy="66" r="8" fill="#F5EFE2"/>
      <circle cx="62" cy="66" r="8" fill="#F5EFE2"/>
      <circle cx="42" cy="57" r="7" fill="#F5EFE2"/>
      <circle cx="58" cy="57" r="7" fill="#F5EFE2"/>
      <circle cx="50" cy="53" r="7.2" fill="#F5EFE2"/>
      <circle cx="31" cy="73" r="5.5" fill="#F5EFE2"/>
      <circle cx="69" cy="73" r="5.5" fill="#F5EFE2"/>
    </svg>
    <div class="company">SA Textiless<span class="sub">Private Limited</span></div>
  </div>

  <div class="person">
    <h1>Balaji Appuswamy</h1>
    <div class="role">Executive Director</div>
  </div>

  <div class="stitch"></div>

  <div class="contacts">
    <a class="row" href="tel:+914294299880">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
      <span class="text"><span class="label">Office</span><span class="value">04294&nbsp;299880</span></span>
    </a>
    <a class="row" href="tel:+919843418880">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></span>
      <span class="text"><span class="label">Mobile</span><span class="value">98434&nbsp;18880</span></span>
    </a>
    <a class="row" href="mailto:balajiappuswamy@gmail.com">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg></span>
      <span class="text"><span class="label">Email</span><span class="value">balajiappuswamy@gmail.com</span></span>
    </a>
  </div>

  <div class="address">
    <div class="heading">Works</div>
    7/153, Pulavarpalayam Village, Nadupatti Post,<br>Tiruppur&nbsp;–&nbsp;638&nbsp;056
  </div>
  <div class="address">
    <div class="heading">Registered Office</div>
    283, Mangalam Road, Karuvampalayam,<br>Tiruppur&nbsp;–&nbsp;641&nbsp;604
  </div>

  <div class="cta-wrap">
    <button class="save-btn" id="saveBtn" onclick="saveContact()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-4a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v4"/><path d="M17 3H5a2 2 0 0 0-2 2v14l4-4h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
      <span id="saveLabel">Save Contact</span>
    </button>
  </div>

</div>

<script>
function saveContact(){
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Appuswamy;Balaji;;;",
    "FN:Balaji Appuswamy",
    "ORG:SA Textiless Private Limited",
    "TITLE:Executive Director",
    "TEL;TYPE=WORK,VOICE:04294 299880",
    "TEL;TYPE=CELL:9843418880",
    "EMAIL;TYPE=INTERNET:balajiappuswamy@gmail.com",
    "ADR;TYPE=WORK:;;7/153, Pulavarpalayam Village, Nadupatti Post;Tiruppur;Tamil Nadu;638056;India",
    "END:VCARD"
  ].join("\n");
  const blob = new Blob([vcard], { type: "text/vcard" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Balaji_Appuswamy_SA_Textiless.vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const btn = document.getElementById("saveBtn");
  const label = document.getElementById("saveLabel");
  btn.classList.add("saved");
  label.textContent = "Contact Saved";
  setTimeout(()=>{ btn.classList.remove("saved"); label.textContent = "Save Contact"; }, 2200);
}
</script>

</body>
</html>
